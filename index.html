<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Engine RPG - Vercel Build</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="raycaster" width="800" height="600"></canvas>
    
    <div id="hud" style="position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 5px;">
      <div id="map-log" style="color: #ff0;">Local: Mundo Aberto</div>
      <div id="spell-log" style="color: #0ff; margin-top: 5px;">Magia: Nenhuma</div>
    </div>

    <div id="mobile-controls" style="position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10;">
      <div id="mobile-movement" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
        <button id="mobile-left" style="grid-column: 1; grid-row: 2; width: 50px; height: 50px;">A</button>
        <button id="mobile-up" style="grid-column: 2; grid-row: 1; width: 50px; height: 50px;">W</button>
        <button id="mobile-down" style="grid-column: 2; grid-row: 2; width: 50px; height: 50px;">S</button>
        <button id="mobile-right" style="grid-column: 3; grid-row: 2; width: 50px; height: 50px;">D</button>
      </div>
      
      <div id="mobile-rotation" style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
        <button id="spell-btn" style="width: 80px; height: 50px; background: #0ff; color: #000; font-weight: bold; border: none;">MAGIA</button>
        <div style="display: flex; gap: 5px;">
          <button id="mobile-rotate-left" style="width: 50px; height: 50px;">←</button>
          <button id="mobile-rotate-right" style="width: 50px; height: 50px;">→</button>
        </div>
      </div>
    </div>

    <div id="spell-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 50, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 200;">
      <h3 style="color: #0ff; margin-bottom: 10px;">Desenhe a Runa</h3>
      <canvas id="spell-canvas" width="400" height="400" style="background: rgba(0,0,0,0.8); border: 2px solid #0ff; max-width: 80%; aspect-ratio: 1/1; touch-action: none;"></canvas>
      
      <div id="spell-controls" style="margin-top: 15px; display: flex; gap: 10px;">
        <button id="close-spell-btn" style="background: #555; color: #fff; padding: 10px; border: none;">Cancelar</button>
        <button id="recast-spell-btn" style="background: #a0a; color: #fff; padding: 10px; border: none;">Recast</button>
        <button id="cast-spell-btn" style="background: #0a0; color: #fff; padding: 10px; border: none;">Executar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
