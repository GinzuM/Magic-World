<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Engine RPG - Vercel Build</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; touch-action: none; }
    #game-container { position: relative; width: 100%; height: 100%; max-width: 800px; max-height: 600px; margin: 0 auto; background: #111; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    .slot { width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 2px solid #555; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="raycaster" width="800" height="600"></canvas>
    
    <div id="hud" style="position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); padding: 5px;">
      <div id="map-log" style="color: #ff0;">Local: Mundo Aberto</div>
      <div id="spell-log" style="color: #0ff; margin-top: 5px;">Magia: Nenhuma</div>
    </div>

    <button id="menu-btn" style="position: absolute; top: 10px; right: 10px; z-index: 20; padding: 10px; background: #333; color: #fff; border: 1px solid #fff; font-family: inherit;">Menu (ESC)</button>

    <div id="hotbar" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10;">
      <div id="slot-0" class="slot">1</div>
      <div id="slot-1" class="slot">2</div>
      <div id="slot-2" class="slot">3</div>
    </div>

    <div id="mobile-controls" style="position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10;">
      <div id="mobile-movement" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
        <button id="mobile-sprint" style="grid-column: 1; grid-row: 1; width: 50px; height: 50px; background: #fa0;">RUN</button>
        <button id="mobile-left" style="grid-column: 1; grid-row: 2; width: 50px; height: 50px;">A</button>
        <button id="mobile-up" style="grid-column: 2; grid-row: 1; width: 50px; height: 50px;">W</button>
        <button id="mobile-down" style="grid-column: 2; grid-row: 2; width: 50px; height: 50px;">S</button>
        <button id="mobile-right" style="grid-column: 3; grid-row: 2; width: 50px; height: 50px;">D</button>
      </div>
      
      <div id="mobile-rotation" style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
        <div style="display: flex; gap: 5px;">
          <button id="action-btn" style="width: 80px; height: 50px; background: #f0f; color: #fff; font-weight: bold; border: none;">AÇÃO</button>
          <button id="spell-btn" style="width: 80px; height: 50px; background: #0ff; color: #000; font-weight: bold; border: none;">MAGIA</button>
        </div>
        <div style="display: flex; gap: 5px;">
          <button id="mobile-rotate-left" style="width: 50px; height: 50px;">←</button>
          <button id="mobile-rotate-right" style="width: 50px; height: 50px;">→</button>
        </div>
      </div>
    </div>

    <div id="pause-menu" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 300;">
      <h2 style="color: #fff; font-size: 24px; margin-bottom: 20px;">JOGO PAUSADO</h2>
      <label style="color: #fff; margin-bottom: 20px; font-size: 16px; cursor: pointer;">
        <input type="checkbox" id="toggle-mobile-controls" checked style="transform: scale(1.5); margin-right: 10px;">
        Mostrar Controles Mobile
      </label>
      <button id="resume-btn" style="padding: 10px 30px; font-size: 16px; background: #fff; color: #000; border: none; cursor: pointer; font-family: inherit; font-weight: bold;">Continuar</button>
    </div>

    <div id="spell-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 30, 0.85); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 200;">
      <h3 style="color: #0ff; margin: 0 0 10px 0; font-size: 18px; text-shadow: 0 0 5px #0ff;">Modo de Desenho</h3>
      <div id="overlay-canvas-container" style="width: 85%; max-width: 360px; aspect-ratio: 1/1; position: relative;">
        <canvas id="spell-canvas" style="position: absolute; top:0; left:0; width:100%; height:100%; background: #000; border: 2px solid #0ff; box-shadow: 0 0 20px #0ff; box-sizing: border-box;"></canvas>
      </div>
      
      <div id="spell-controls" style="margin-top: 20px; display: flex; gap: 10px;">
        <button id="close-spell-btn" style="background: #555; color: #fff; padding: 12px 20px; border: none; font-weight: bold;">Cancelar</button>
        <button id="cast-spell-btn" style="background: #0a0; color: #fff; padding: 12px 25px; border: none; font-weight: bold;">Executar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
